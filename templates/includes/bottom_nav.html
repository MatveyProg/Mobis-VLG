<nav class="bottom-nav" aria-label="Мобильная навигация">
  <a href="{% url 'pages:home' %}" class="bottom-nav__item{% if request.resolver_match.namespace == 'pages' and request.resolver_match.url_name == 'home' %} is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Главная
  </a>
  <a href="{% url 'catalog:product_list' %}" class="bottom-nav__item{% if request.resolver_match.namespace == 'catalog' %} is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Каталог
  </a>
  {% if user.is_authenticated and not user.is_staff %}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Корзина
    </a>
    <a href="{% url 'orders:order_list' %}" class="bottom-nav__item{% if request.resolver_match.url_name == 'order_list' or request.resolver_match.url_name == 'order_detail' %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Заказы
    </a>
    <a href="{% url 'orders:client_request_draft' %}" class="bottom-nav__item{% if 'client_request' in request.resolver_match.url_name %} is-active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Заявки
    </a>
    <a href="{% url 'orders:order_list' %}" class="bottom-nav__item">

      Профиль
    </a>

    <a href="{% url 'catalog:product_list' %}?in_stock=1" class="bottom-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>

      Вход

    <a href="{% url 'accounts:register' %}" class="bottom-nav__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      Регистрация
    </a>
