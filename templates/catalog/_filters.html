<form method="get" class="filters-panel h-100">
  <h2 class="h5 mb-3">Фильтры</h2>
  <div class="mb-3">
    <label class="form-label" for="filterQ">Поиск</label>
    <input type="text" name="q" id="filterQ" value="{{ filters.q }}" class="form-control" placeholder="Артикул, название, кросс">
  </div>
  <div class="mb-3">
    <label class="form-label" for="filterCategory">Категория</label>
    <select name="category" id="filterCategory" class="form-select">
      <option value="">Все</option>
      {% for cat in categories %}
        <option value="{{ cat.slug }}" {% if filters.category == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
        {% for child in cat.children.all %}
          <option value="{{ child.slug }}" {% if filters.category == child.slug %}selected{% endif %}>&nbsp;&nbsp;{{ child.name }}</option>
        {% endfor %}
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="filterCondition">Состояние</label>
    <select name="condition" id="filterCondition" class="form-select">
      <option value="">Любое</option>
      <option value="new" {% if filters.condition == 'new' %}selected{% endif %}>Новый</option>
      <option value="used" {% if filters.condition == 'used' %}selected{% endif %}>Б/У</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="filterMake">Марка</label>
    <select name="make" id="filterMake" class="form-select" onchange="this.form.submit()">
      <option value="">Все</option>
      {% for make in makes %}
        <option value="{{ make.id }}" {% if filters.make == make.id|stringformat:'s' %}selected{% endif %}>{{ make.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="filterModel">Модель</label>
    <select name="model" id="filterModel" class="form-select">
      <option value="">Все</option>
      {% for model in models %}
        <option value="{{ model.id }}" {% if filters.model == model.id|stringformat:'s' %}selected{% endif %}>{{ model.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label" for="filterSort">Сортировка</label>
    <select name="sort" id="filterSort" class="form-select">
      <option value="-created_at" {% if filters.sort == '-created_at' %}selected{% endif %}>Сначала новые</option>
      <option value="price" {% if filters.sort == 'price' %}selected{% endif %}>Цена ↑</option>
      <option value="-price" {% if filters.sort == '-price' %}selected{% endif %}>Цена ↓</option>
    </select>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="in_stock" value="1" id="inStock" {% if filters.in_stock == '1' %}checked{% endif %}>
    <label class="form-check-label" for="inStock">Только в наличии</label>
  </div>
  <button class="btn btn-accent w-100" type="submit">Применить</button>
  <a class="btn btn-outline-secondary w-100 mt-2" href="{% url 'catalog:product_list' %}">Сбросить</a>
</form>
