{% extends "base.html" %}
{% block title %}{{ title }} — {{ SHOP_NAME }}{% endblock %}
{% block content %}
<a href="{% url 'warehouse:stock_in_list' %}" class="text-decoration-none">← К приходам</a>
<h1 class="h3 mt-2 mb-3">{{ title }}</h1>
<form method="post" class="filters-panel col-lg-6">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-accent" type="submit">Создать</button>
</form>
{% endblock %}
